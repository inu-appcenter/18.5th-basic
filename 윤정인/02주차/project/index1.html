<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자기소개</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div id="container">
    <div id="card">

      <!-- 시계는 script.js가 1초마다 바뀐다. -->
      <p class="clock" id="clock"></p>

      <h3 class="title">PROFILE</h3>
      <img class="avatar" src="./profile.jpg" alt="프로필 사진">

      <!-- 인사말 : script.js가 한 글자씩 타이핑 -->
      <p class="intro" id="intro"></p>

      <table class="info" id="info"></table>

      <h2>연구</h2>
      <video src="./lafan1_0903.mp4" autoplay muted loop playsinline></video>

      <h2>관심사</h2>
      <p>
        <strong>Fashion</strong><br>
        올해 패션 브랜드를 만드는 프로젝트의 웹페이지를 제작해볼 계획입니다.
      </p>
      <div class="photos">
        <img src="./20260709OfftoParis-8284.jpg" alt="패션 프로젝트 사진 1">
        <img src="./20260709OfftoParis-8049.jpg" alt="패션 프로젝트 사진 2">
      </div>

    </div>

    <div id="links"></div>

  </div>

  <script src="./script.js"></script>
</body>
</html>
